apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldap
  namespace: print-quota
  labels:
    app: ldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ldap
  template:
    metadata:
      labels:
        app: ldap
    spec:
      containers:
        - name: ldap
          image: osixia/openldap:1.5.0
          env:
            - name: LDAP_ORGANISATION
              value: "Company"
            - name: LDAP_DOMAIN
              value: "company.local"
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: print-quota-secrets
                  key: LDAP_ADMIN_PASSWORD
            - name: LDAP_TLS
              value: "false"
          ports:
            - containerPort: 389
              name: ldap-port
            - containerPort: 636
              name: ldaps-port
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "100m"
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 389
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 389
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ldap-service
  namespace: print-quota
spec:
  ports:
    - port: 389
      targetPort: 389
      name: ldap
    - port: 636
      targetPort: 636
      name: ldaps
  selector:
    app: ldap
