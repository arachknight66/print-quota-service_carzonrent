# Custom Enterprise Apache Security and Performance Configurations
# Loaded via Include /etc/httpd/conf.d/security.conf

# 1. Performance tuning: HTTP KeepAlive configuration
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# 2. General Infrastructure Hardening
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# 3. Security Headers Injection (requires mod_headers)
<IfModule mod_headers.c>
    # Prevent framing to stop clickjacking attacks
    Header set X-Frame-Options "SAMEORIGIN"
    
    # Enforce MIME type sniffing protection
    Header set X-Content-Type-Options "nosniff"
    
    # Enable Cross-Site Scripting filtering in older browsers
    Header set X-XSS-Protection "1; mode=block"
    
    # Secure Referrer Policy
    Header set Referrer-Policy "no-referrer-when-downgrade"
    
    # Content Security Policy (allows font access from Google Fonts for our dashboard style)
    Header set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';"
    
    # Enforce HTTPS (if SSL is active)
    Header set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</IfModule>

# 4. Gzip Compression (requires mod_deflate)
<IfModule mod_deflate.c>
    # Compress standard text and JSON types
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json application/xml
    
    # Deal with older browser compression bugs
    BrowserMatch ^Mozilla/4 gzip-only-text/html
    BrowserMatch ^Mozilla/4\.0[678] no-gzip
    BrowserMatch \bMSIE !no-gzip !gzip-only-text/html
</IfModule>
