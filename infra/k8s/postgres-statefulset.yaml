apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: print-quota
  labels:
    app: postgres
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: "printquota"
            - name: POSTGRES_USER
              value: "printuser"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: print-quota-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            limits:
              cpu: "1.0"
              memory: 1Gi
            requests:
              cpu: "250m"
              memory: 512Mi
          healthCheck:
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - printuser
                - -d
                - printquota
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - printuser
                - -d
                - printquota
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-db-vol
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-db-vol
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: print-quota
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
