# =====================================================================
# Print Quota Management System - RSyslog Master Aggregation Config
# Role: Master Node (CentOS Stream 9 Server)
# Path: /etc/rsyslog.d/printkeep-master.conf
# Last Updated: 2026-07
# =====================================================================

# Enable TCP syslog reception
module(load="imtcp")
input(type="imtcp" Port="514")

# Template to dynamically write incoming logs to directories by client hostname
template(Name="PrintKeepAggregated"
         Type="string"
         String="/var/log/print-quota/aggregated/%HOSTNAME%_app.log")

# Route logs matching 'printkeep-app' tag to the dynamic path
if $programname == 'printkeep-app' then {
    action(type="omfile" DynaFile="PrintKeepAggregated")
    stop
}
