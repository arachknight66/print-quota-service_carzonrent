apiVersion: v1
kind: ServiceAccount
metadata:
  name: print-quota-sa
  namespace: print-quota
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: print-quota-role
  namespace: print-quota
rules:
  # Least privilege rules: allow getting own pods and configmaps if needed
  - apiGroups: [""]
    resources: ["pods", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: print-quota-rb
  namespace: print-quota
subjects:
  - kind: ServiceAccount
    name: print-quota-sa
    namespace: print-quota
roleRef:
  kind: Role
  name: print-quota-role
  apiGroup: rbac.authorization.k8s.io
