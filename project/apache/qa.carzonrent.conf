ServerName qa.carzonrent.com
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
AddOutputFilterByType DEFLATE text/html text/plain text/css application/json application/javascript
LogFormat "%h %l %u %t \"%r\" %>s %b duration_us=%D correlation_id=\"%{X-Correlation-ID}i\" forwarded_for=\"%{X-Forwarded-For}i\" user_agent=\"%{User-Agent}i\"" carzonrent_combined

SSLProxyEngine On
Timeout 2400
ProxyTimeout 2400
ProxyBadHeader Ignore
ProxyRequests Off
ProxyPreserveHost On

<VirtualHost *:8080>
    ServerName qa.carzonrent.com
    ServerAlias qa.carzonrent localhost

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"
    RequestHeader set X-Forwarded-Host "qa.carzonrent.com"
    RequestHeader setifempty X-Correlation-ID "apache-%t-%{UNIQUE_ID}e"

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
    Header always set X-Permitted-Cross-Domain-Policies "none"
    Header always set X-Download-Options "noopen"
    Header always set Cache-Control "no-store" "expr=%{REQUEST_URI} =~ m#^/(health|info|metrics|prometheus)#"

    ProxyPass        / http://127.0.0.1:8085/
    ProxyPassReverse / http://127.0.0.1:8085/

    ErrorLog  /proc/self/fd/2
    LogLevel warn
    CustomLog /proc/self/fd/1 carzonrent_combined
</VirtualHost>
