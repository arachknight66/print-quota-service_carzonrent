version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: print-quota-db
    environment:
      POSTGRES_DB: printquota
      POSTGRES_USER: printuser
      POSTGRES_PASSWORD: printpassword
    ports:
      - "5432:5432"
    volumes:
      - ./.postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printuser -d printquota"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: print-quota-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@company.local
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
