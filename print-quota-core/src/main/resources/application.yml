spring:
  profiles:
    active: dev
  application:
    name: print-quota-service

server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,application/json,application/xml,application/octet-stream
    min-response-size: 2048

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

info:
  app:
    name: print-quota-service
    version: 1.0.0
    description: Print Quota Management System Middleware
