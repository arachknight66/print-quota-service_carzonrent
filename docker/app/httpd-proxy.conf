# =====================================================================
# Print Quota Management System - Apache HTTPD Reverse Proxy Configuration
# Custom configuration loaded into /etc/httpd/conf.d/printkeep-proxy.conf
# =====================================================================

# Global Server Signature & Hardening
ServerSignature Off
ServerTokens ProductOnly
TraceEnable Off

# 1. Reverse Proxy Routing
ProxyPreserveHost On
ProxyRequests Off
SSLProxyEngine On

# Define main application reverse proxy rules
ProxyPass / http://127.0.0.1:8085/
ProxyPassReverse / http://127.0.0.1:8085/

# 2. Monitoring Endpoints (Exposed for Prometheus Scraping)
<Location "/actuator/health">
    ProxyPass http://127.0.0.1:8085/actuator/health
    ProxyPassReverse http://127.0.0.1:8085/actuator/health
    Require all granted
</Location>

<Location "/actuator/prometheus">
    ProxyPass http://127.0.0.1:8085/actuator/prometheus
    ProxyPassReverse http://127.0.0.1:8085/actuator/prometheus
    Require all granted
</Location>

# 3. Security Headers Injection (mod_headers)
<IfModule mod_headers.c>
    Header set X-Frame-Options "SAMEORIGIN"
    Header set X-Content-Type-Options "nosniff"
    Header set X-XSS-Protection "1; mode=block"
    Header set Referrer-Policy "strict-origin-when-cross-origin"
    Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';"
</IfModule>

# 4. Gzip Deflate Compression (mod_deflate)
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json application/xml
</IfModule>

# 5. Access and Error Logging
ErrorLog "/var/log/httpd/printkeep_error_log"
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" printkeep_combined
CustomLog "/var/log/httpd/printkeep_access_log" printkeep_combined
