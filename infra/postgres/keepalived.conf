# =====================================================================
# Print Quota Management System - Keepalived Floating VIP Config
# Path: /etc/keepalived/keepalived.conf
# Note: OPTIONAL/ADVANCED setup to establish active-passive floating DB IP.
# Last Updated: 2026-07
# =====================================================================

global_defs {
    router_id printkeep_db_router
    enable_script_security
    script_user postgres
}

# Script to verify PostgreSQL is running and accepting SQL queries
vrrp_script check_postgres {
    script "/usr/bin/pg_isready -q"
    interval 2
    weight 2
}

vrrp_instance VI_DB {
    state BACKUP               # Configure both hosts as BACKUP; let priority decide master
    interface eth0             # Replace with the actual private network interface name
    virtual_router_id 51
    priority 100               # Primary VM priority: 101, Standby VM priority: 100
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass SecDBPass123  # Shared cluster secret
    }

    # The floating Virtual IP (VIP) shared across database instances.
    # Replace with the actual unassigned private IP in your corporate subnet.
    virtual_ipaddress {
        <FLOATING_DB_VIP>/24
    }

    track_script {
        check_postgres
    }
}
