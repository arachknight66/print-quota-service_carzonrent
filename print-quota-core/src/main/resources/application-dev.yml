server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/printquota
    username: printuser
    password: printpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.printkeep.quota: DEBUG
    org.springframework.web: INFO
