# =====================================================================
# Print Quota Management System - Apache HTTP Server Load Balancer Config
# Role: Master VM Load Balancer (CentOS Stream 9)
# Path: /etc/httpd/conf/httpd.conf (or /etc/httpd/conf.d/printkeep.conf)
# Last Updated: 2026-07
# =====================================================================

ServerRoot "/etc/httpd"

# Required Apache Modules
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule status_module modules/mod_status.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_hcheck_module modules/mod_proxy_hcheck.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
LoadModule slotmem_shm_module modules/mod_slotmem_shm.so

TypesConfig /etc/mime.types

User apache
Group apache

# Log Locations
ErrorLog "logs/error_log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "logs/access_log" combined

# =====================================================================
# TCP BALANCER: Port 8080 (mTLS Passthrough for Printers)
# =====================================================================
# Port 8080 is reserved for print spooler clients submitting IPP jobs.
# Balances raw TCP streams (tcp://) so that the clients' X.509 certs
# survive directly to the Spring Boot application layer for mTLS (BR-1).
# =====================================================================
Listen 8080

<VirtualHost *:8080>
    ProxyRequests Off
    ProxyPreserveHost On

    <Proxy "balancer://tcp_cluster">
        # Backend App VM instances (Replace placeholders with actual IPs)
        BalancerMember "tcp://<WORKER1_IP>:8080"
        BalancerMember "tcp://<WORKER2_IP>:8080"
        
        ProxySet lbmethod=byrequests
    </Proxy>

    # Route all incoming spooler traffic to the TCP balancer
    ProxyPass / "balancer://tcp_cluster/"
</VirtualHost>


# =====================================================================
# HTTP BALANCER: Port 8081 (Self-Service & Actuator Health Checks)
# =====================================================================
# Port 8081 manages administrative and employee self-service queries
# (/api/v1/me/quota). Performs active HTTP health checks (mod_proxy_hcheck)
# against the Spring Boot actuator endpoint.
# =====================================================================
Listen 8081

<VirtualHost *:8081>
    ProxyRequests Off
    ProxyPreserveHost On

    <Proxy "balancer://http_cluster">
        # Backend App VM instances with active readiness checks (every 5s)
        BalancerMember "http://<WORKER1_IP>:8080" hcmethod=GET hcuri=/actuator/health/readiness hcinterval=5
        BalancerMember "http://<WORKER2_IP>:8080" hcmethod=GET hcuri=/actuator/health/readiness hcinterval=5
        
        ProxySet lbmethod=byrequests
    </Proxy>

    ProxyPass / "balancer://http_cluster/"
</VirtualHost>


# =====================================================================
# APACHE STATUS DASHBOARD (Local Monitoring Only)
# =====================================================================
Listen 9000

<VirtualHost 127.0.0.1:9000>
    <Location "/server-status">
        SetHandler server-status
        Require local
    </Location>
</VirtualHost>
