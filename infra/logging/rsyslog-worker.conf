# =====================================================================
# Print Quota Management System - RSyslog Worker Forwarding Config
# Role: Worker Node (CentOS Stream 9 Client)
# Path: /etc/rsyslog.d/printkeep-worker.conf
# Last Updated: 2026-07
# =====================================================================

# Load the file monitoring module
module(load="imfile")

# Monitor the print-quota application log file
input(type="imfile"
      File="/var/log/printkeep/app.log"
      Tag="printkeep-app"
      Severity="info"
      Facility="local0")

# Forward all local0 (printkeep) logs via TCP to the Master VM
# Replace <MASTER_IP> with the actual Master VM private IP address.
# Uses port 514 for rsyslog TCP forwarding.
local0.* action(type="omfwd"
                Target="<MASTER_IP>"
                Port="514"
                Protocol="tcp"
                action.resumeRetryCount="100"
                queue.type="linkedList"
                queue.size="10000")
