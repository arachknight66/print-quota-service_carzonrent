apiVersion: v1
kind: ConfigMap
metadata:
  name: print-quota-config
  namespace: print-quota
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8085"
  SERVER_ADDRESS: "127.0.0.1"
  SSL_ENABLED: "false"
  LDAP_URL: "ldap://ldap-service.print-quota.svc.cluster.local:389"
  LDAP_SSL_ENABLED: "false"
  LDAP_BASE_DN: "dc=company,dc=local"
  LDAP_SEARCH_BASE: "ou=users"
  LDAP_GROUP_SEARCH_BASE: "ou=groups"
  LDAP_SYNC_ENABLED: "false"
  LOG_PATH: "/app/logs"
  COST_PER_PAGE: "0.05"
---
apiVersion: v1
kind: Secret
metadata:
  name: print-quota-secrets
  namespace: print-quota
type: Opaque
stringData:
  # Replace values with production secrets prior to deployment
  DB_PASSWORD: "SecDBPassword123"
  LDAP_ADMIN_PASSWORD: "SecLdapAdminPassword123"
  LDAP_BIND_PASSWORD: "SecLdapAdminPassword123"
