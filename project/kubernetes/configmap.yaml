apiVersion: v1
kind: ConfigMap
metadata:
  name: carzonrent-qa-config
  namespace: carzonrent-qa
data:
  SPRING_PROFILES_ACTIVE: "qa"
  SPRING_APPLICATION_NAME: "qa-dashboard"
  SERVER_ADDRESS: "127.0.0.1"
  SERVER_PORT: "8085"
  CARZONRENT_ENVIRONMENT: "QA"
  CONTAINER_NAME: "qa.carzonrent"
  LOG_LEVEL_ROOT: "INFO"
  LOG_LEVEL_APP: "INFO"
  JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/urandom"
  BUILD_VERSION: "2.0.0"
  GIT_COMMIT_ID: "unknown"
  BUILD_TIMESTAMP: "unknown"
  DOCKER_IMAGE_TAG: "latest"
  JENKINS_BUILD_NUMBER: "kubernetes"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://print-quota-db:5432/print_quota_db"
  SPRING_DATASOURCE_USERNAME: "print_quota_user"
  SPRING_LDAP_URLS: "ldap://print-quota-ldap:389/dc=carzonrent,dc=local"
  SPRING_LDAP_USERNAME: "cn=admin,dc=carzonrent,dc=local"
