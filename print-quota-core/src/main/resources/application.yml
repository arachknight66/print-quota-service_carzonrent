spring:
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  application:
    name: print-quota-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  cache:
    type: caffeine
    cache-names: ldapUsers
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s

server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,application/json,application/xml,application/octet-stream
    min-response-size: 2048

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: PRINTKEEP_ADMIN
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,ldap
        startup:
          include: db


info:
  app:
    name: print-quota-service
    version: 1.0.0
    description: Print Quota Management System Middleware

# LDAP Active Directory Configuration (overridden by profile or env vars)
app:
  spool:
    directory: ${SPOOL_DIRECTORY:/var/spool/print-quota}
  ldap:
    urls:
      - ${LDAP_URL}
    base-dn: ${LDAP_BASE_DN}
    username: ${LDAP_BIND_DN}
    password: ${LDAP_BIND_PASSWORD}
    search-base: ${LDAP_SEARCH_BASE}
    connection-timeout: ${LDAP_CONNECT_TIMEOUT:5000}
    read-timeout: ${LDAP_READ_TIMEOUT:5000}
    ssl-enabled: ${LDAP_SSL_ENABLED:false}
    referral: ignore
    domain-prefix: ${LDAP_DOMAIN_PREFIX:company\\}
    pool:
      min-idle: 2
      max-active: 8
      validation-on-borrow: true
    sync:
      enabled: ${LDAP_SYNC_ENABLED:false}
      cron: ${LDAP_SYNC_CRON:0 0 * * * *}
  security:
    ldap:
      user-search-filter: ${LDAP_USER_SEARCH_FILTER:(sAMAccountName={0})}
      group-search-base: ${LDAP_GROUP_SEARCH_BASE:ou=groups}
      group-search-filter: ${LDAP_GROUP_SEARCH_FILTER:(member={0})}
  admin:
    # Comma-separated list of IPv4 CIDR blocks permitted to access /api/v1/admin/**.
    # PRODUCTION: replace with the actual IT management subnet CIDR, e.g. 10.10.5.0/24.
    allowed-networks: ${ADMIN_ALLOWED_NETWORKS:127.0.0.0/8,10.0.0.0/8}
    # Set to false in non-production environments to disable the IP restriction filter.
    ip-filter-enabled: ${ADMIN_IP_FILTER_ENABLED:true}
