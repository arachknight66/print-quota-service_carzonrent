# Apache HTTP Server Reverse Proxy Configuration for Carzonrent QA Staging
# Custom configuration loaded into /etc/httpd/conf.d/qa.conf

# Global Timeout Settings
Timeout 2400
ProxyTimeout 2400

# Proxy Settings
ProxyBadHeader Ignore

# SSL Proxying Support (Passthrough backend queries if needed, required by specs)
SSLProxyEngine On

# Reverse Proxy Rules mapping root to Spring Boot running on loopback
ProxyPass / http://127.0.0.1:8085/
ProxyPassReverse / http://127.0.0.1:8085/

# Secure Apache configuration overrides
ServerTokens ProductOnly
ServerSignature Off
TraceEnable Off

# Ensure Host header is preserved during proxy routing
ProxyPreserveHost On

<Proxy *>
    Require all granted
</Proxy>
