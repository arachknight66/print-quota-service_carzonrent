server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8085}
  ssl:
    enabled: false
  shutdown: graceful

spring:
  application:
    name: ${APP_NAME:print-quota-service}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:printquota;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=MONTH}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  liquibase:
    enabled: false

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.printkeep.quota: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    ldap:
      enabled: false

# Mimic the base application properties but defaults for QA/staging
app:
  spool:
    directory: ${SPOOL_DIRECTORY:${java.io.tmpdir}/print-quota-spool}
  ldap:
    urls:
      - ${LDAP_URL:ldap://localhost:389}
    base-dn: ${LDAP_BASE_DN:dc=company,dc=local}
    username: ${LDAP_BIND_DN:cn=admin,dc=company,dc=local}
    password: ${LDAP_BIND_PASSWORD:admin}
    search-base: ${LDAP_SEARCH_BASE:ou=users}
    connection-timeout: 1000
    read-timeout: 1000
    ssl-enabled: false
    referral: ignore
    pool:
      min-idle: 1
      max-active: 2
    sync:
      enabled: false
      cron: "-"
  security:
    ldap:
      user-search-filter: (uid={0})
      group-search-base: ou=groups
      group-search-filter: (member={0})

info:
  app:
    name: ${APP_NAME:print-quota-service}
    version: ${APP_VERSION:1.0.0}
    description: "Print Quota Management System Middleware (QA Phase 2 Staging)"
    environment: ${STAGE_ENV:QA-Phase2}
