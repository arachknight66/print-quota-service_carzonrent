{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "carzonrent-qa.fullname" . }}
  namespace: {{ include "carzonrent-qa.namespace" . }}
  labels:
    {{- include "carzonrent-qa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "carzonrent-qa.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingress.namespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    {{- if .Values.networkPolicy.egress.allowDns }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
{{- end }}
